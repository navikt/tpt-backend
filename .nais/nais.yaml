apiVersion: nais.io/v1alpha1
kind: Application
metadata:
  name: tpt-backend
  namespace: appsec
  labels:
    team: appsec
spec:
  ingresses:
    - https://tpt-backend.ansatt.nav.no
  azure:
    application:
      enabled: true
      allowAllUsers: true
      claims:
        groups:
          - id: "d633d27b-a470-4b9d-984e-85499f126e18"
          - id: "b0c13827-8451-4c52-9ed8-bdf09a2985a3"
          - id: "5f8b7bac-c3bf-4597-a9b1-42be0c8410f8"
          - id: "45e54224-3309-4797-89ed-a62aa76df3d0"
        extra:
          - "NAVident"
  accessPolicy:
    inbound:
      rules:
        - application: tpt-frontend
        - application: tpt-data-collector
    outbound:
      rules:
        - application: tpt-data-collector
      external:
        - host: teamkatalog-api.intern.nav.no
        - host: console.nav.cloud.nais.io
        - host: db.gcve.eu
  gcp:
    sqlInstances:
      - type: POSTGRES_17
        tier: db-g1-small
        databases:
          - name: tpt
  image: {{image}}
  port: 8080
  leaderElection: true
  liveness:
    initialDelay: 60
    path: /internal/isalive
  readiness:
    initialDelay: 60
    path: /internal/isready
  prometheus:
    enabled: true
    path: /internal/metrics
  replicas:
    max: 2
    min: 2
  resources:
    limits:
      memory: 3584Mi
    requests:
      cpu: 300m
      memory: 1768Mi
  observability:
    logging:
      destinations:
        - id: loki
    autoInstrumentation:
      enabled: true
      runtime: java
  env:
    - name: NAIS_API_URL
      value: "https://console.nav.cloud.nais.io/graphql"
    - name: TEAMKATALOGEN_URL
      value: "https://teamkatalog-api.intern.nav.no"
    - name: OTEL_LOGS_EXPORTER
      value: otlp
    - name: ADMIN_GROUPS
      value: "d633d27b-a470-4b9d-984e-85499f126e18,b0c13827-8451-4c52-9ed8-bdf09a2985a3,5f8b7bac-c3bf-4597-a9b1-42be0c8410f8,45e54224-3309-4797-89ed-a62aa76df3d0"
  envFrom:
    - secret: tpt-backend
